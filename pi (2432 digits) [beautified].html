< !doctype html>
    <title>pi (2432 digits)</title>
    <meta name=viewport content="width=device-width,initial-scale=1">

    <body style="background:#111;color:#eee;font-family:monospace;margin:8px">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">DIGITS:<input id=nd type=number value=2432 min=1 max=2432 style="width:68px;font-size:16px"><button onclick=run() style="font-size:16px">RUN</button><span id=st></span></div><canvas id=c width=512 height=384 style="image-rendering:pixelated;margin-top:8px;border:1px solid #333;width:100%;max-width:512px;height:auto;display:block"></canvas>
        <script>
            const P = "8P3955T7[T4SP\\+_TS?X3\\538838<S",
                G = [...Array(10)].map((_, i) => [0, 1, 2].flatMap(j => {
                    let v = P.charCodeAt(i * 3 + j) - 35;
                    return j < 2 ? [v >> 3, v & 7] : [v >> 3]
                })),
                ctx = c.getContext("2d"),
                INK = ["#B63125",
                    "#000000"
                ],
                PAP = ["#FFFFFF",
                    "#78D67D"
                ];
            let tm;

            function run() {
                clearTimeout(tm);
                let nd = Math.max(1, Math.min(2432, +document.getElementById("nd").value || 2432)),
                    len = Math.floor(nd * 10 / 3) + 2,
                    a = new Int32Array(len).fill(2),
                    pred = 0,
                    nines = 0,
                    x = 0,
                    y = 1,
                    row = 0,
                    n = 0,
                    first = 1;
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, 512, 384);
                ctx.fillStyle = PAP[1];
                ctx.fillRect(0, 0, 512, 2);

                for (let r = 0; r < 38; r++) {
                    ctx.fillStyle = PAP[r & 1];
                    ctx.fillRect(0, (r * 5 + 1) * 2, 512, 10)
                }

                ctx.fillStyle = INK[0];
                ctx.fillRect(6, 10, 2, 2);

                function put(k) {
                    if (first) {
                        first = 0;
                        return
                    }

                    if (n >= nd) return;
                    ctx.fillStyle = INK[row & 1];
                    G[k].forEach((r, j) => [0, 1, 2].forEach(b => (r & (4 >> b)) && ctx.fillRect((x * 4 + b) * 2, (y + j) * 2, 2, 2)));
                    n++;
                    x++;

                    if (x > 63) {
                        x = 0;
                        y += 5;
                        row++
                    }
                }

                function step() {
                    let t = Math.min(nd, n + 64);

                    while (n < t) {
                        let q = 0;

                        for (let i = len; i > 0; i--) {
                            let x0 = 10 * a[i - 1] + q * i,
                                g = 2 * i - 1;
                            a[i - 1] = x0 % g;
                            q = x0 / g | 0
                        }

                        a[0] = q % 10;
                        q = q / 10 | 0;
                        if (q === 9) nines++;

                        else if (q === 10) {
                            put(pred + 1);
                            for (let k = 0; k < nines; k++) put(0);
                            pred = 0;
                            nines = 0
                        } else {
                            put(pred);
                            pred = q;
                            for (let k = 0; k < nines; k++) put(9);
                            nines = 0
                        }
                    }

                    st.textContent = n < nd ? n + " digits..." : "Done (" + n + " digits)";
                    if (n < nd) tm = setTimeout(step, 0)
                }

                step()
            }

            run()
        </script>
